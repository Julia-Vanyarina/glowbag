<!doctype html>
<html lang="ru">
<head>

  <meta name="theme-color" content="#F2DCE1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="glowbag">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Курсив и гротеск лежат в папке fonts; Google Fonts нужны только для вариантов «ярлыки» и «3D» -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500..800&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Rubik:wght@600..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button class="mini-logo" data-act="tab" data-v="home" aria-label="Главная">glowbag</button>
      <button class="menu-btn" id="menuBtn" data-act="menu" aria-label="Меню" aria-expanded="false">
        <span class="mb-lines"><i></i><i></i></span><span>меню</span>
      </button>
    </header>
    <main id="main"></main>
    <p style="text-align:center;font-size:11px;opacity:.45;margin-top:34px" id="ver"></p>
  </div>

  <button class="fab" id="fab" data-act="new" aria-label="Добавить средство" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="menu" id="menu" hidden>
    <div class="menu-scrim" data-act="menu-close"></div>
    <nav class="menu-paper" aria-label="Разделы">
      <button class="menu-x" data-act="menu-close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <p class="menu-kicker">glowbag · навигация</p>
      <div class="menu-list" id="menuList"></div>
      <p class="menu-foot" id="menuFoot"></p>
    </nav>
  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="chrome-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#D8DBE0"/><stop offset=".5" stop-color="#9DA3AD"/>
      <stop offset=".68" stop-color="#F1F2F4"/><stop offset="1" stop-color="#868C96"/>
    </linearGradient></defs></svg>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>

</html>
